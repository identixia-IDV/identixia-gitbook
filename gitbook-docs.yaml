$schema: https://api.gitbook.com/gitbook-docs.yaml
site:
  title: Identixia Docs
  structure:
    - type: section
      key: section-documentation
      title: Documentation
      path: documentation
      icon: book-open
      default: true
      description: What the products do, what you need, and what the sample returns.
      children:
        - type: space
          key: space-1
          title: Documentation
          path: content
          default: true
          content:
            directory: ./documentation
    - type: section
      key: section-developers
      title: Developers
      path: developers
      icon: code
      description: How to add the SDK to your app and call the kit.
      children:
        - type: space
          key: space-developers
          title: Developers
          path: content
          default: true
          content:
            directory: ./developers
    - type: section
      key: section-guides
      title: Guides
      path: guides
      icon: compass
      description: Choose a product, run the sample, request a license, and contact support.
      children:
        - type: space
          key: space-guides
          title: Guides
          path: content
          default: true
          content:
            directory: ./guides
